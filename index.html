<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4fa; color: #222; }
  header { background: #5b4ce0; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header b { font-size: 18px; flex: 1; }
  header button { background: rgba(255,255,255,.2); color: #fff; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.06); margin-bottom: 18px; }
  .login { max-width: 360px; margin: 12vh auto; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 9px; font-size: 15px; margin: 4px 0 12px; }
  button { border: 0; border-radius: 9px; padding: 9px 16px; font-size: 14px; cursor: pointer; background: #5b4ce0; color: #fff; }
  button:hover { opacity: .88; }
  button.gray { background: #e8e8f0; color: #222; }
  button.red { background: #ee4b5f; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; }
  tr.click { cursor: pointer; } tr.click:hover { background: #f6f5ff; }
  .tag { background: #ece9ff; color: #5b4ce0; border-radius: 99px; padding: 2px 9px; font-size: 12px; margin-right: 4px; }
  .err { color: #d22; min-height: 20px; font-size: 14px; }
  .hint { color: #888; font-size: 13px; }
  .tabs button { background: #e8e8f0; color: #222; } .tabs button.on { background: #5b4ce0; color: #fff; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="loginView" class="card login">
  <h2>Вход</h2>
  <form id="loginForm">
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Пароль<input id="password" type="password" required autocomplete="current-password"></label>
    <div class="err" id="loginErr"></div>
    <button style="width:100%">Войти</button>
  </form>
  <p class="hint">Тест: teacher@example.com / teacher, admin@example.com / admin, superadmin@example.com / superAdmin</p>
</div>

<div id="appView" class="hidden">
  <header><b>🎓 Students</b><span id="who"></span><button id="logout">Выйти</button></header>
  <main>
    <div class="row tabs" style="margin-bottom:16px">
      <button data-tab="students" id="tabStudents">Студенты</button>
      <button data-tab="users" id="tabUsers">Пользователи</button>
    </div>

    <section id="students">
      <div class="card">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">Студенты</h3>
          <button id="addStudentBtn" class="adminOnly">+ Добавить</button></div>
        <table><thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th></tr></thead><tbody id="studentRows"></tbody></table>
      </div>
      <div class="card hidden" id="studentCard"></div>
      <div class="card hidden" id="studentForm">
        <h3>Новый студент</h3>
        <input id="sName" placeholder="Имя"><input id="sSurname" placeholder="Фамилия">
        <input id="sPhone" placeholder="Телефон"><input id="sEmail" placeholder="Email">
        <div class="err" id="sErr"></div>
        <div class="row"><button id="sSave">Сохранить</button><button class="gray" id="sCancel">Отмена</button></div>
      </div>
    </section>

    <section id="users" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Пользователи</h3>
        <table><thead><tr><th>ID</th><th>Email</th><th>Роли</th><th></th></tr></thead><tbody id="userRows"></tbody></table>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Новый пользователь</h3>
        <input id="uEmail" placeholder="Email"><input id="uPass" type="password" placeholder="Пароль">
        <div class="row">
          <label><input type="checkbox" value="TEACHER" class="uRole" style="width:auto" checked> TEACHER</label>
          <label><input type="checkbox" value="ADMIN" class="uRole" style="width:auto"> ADMIN</label>
          <label><input type="checkbox" value="SUPER_ADMIN" class="uRole" style="width:auto"> SUPER_ADMIN</label>
        </div>
        <div class="err" id="uErr"></div>
        <button id="uSave">Создать</button>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let roles = [];

// --- API: токен держим в sessionStorage, при 401 — выход ---
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json' };
  const token = sessionStorage.getItem('token');
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && !url.includes('/auth/')) { logout(); throw new Error('Сессия истекла'); }
  if (res.status === 403) throw new Error('Недостаточно прав');
  if (!res.ok) {
    let msg = 'Ошибка ' + res.status;
    try { msg = (await res.json()).message || msg; } catch {}
    throw new Error(res.status === 401 ? 'Неверный email или пароль' : msg);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// безопасное создание ячеек: только textContent, никакого innerHTML с данными
function cell(tr, text) { const td = document.createElement('td'); td.textContent = text ?? ''; tr.appendChild(td); return td; }
function btn(text, cls, onClick) { const b = document.createElement('button'); b.textContent = text; if (cls) b.className = cls; b.onclick = onClick; return b; }
const has = (...r) => r.some((x) => roles.includes(x));

// --- вход/выход ---
$('loginForm').onsubmit = async (e) => {
  e.preventDefault(); $('loginErr').textContent = '';
  try {
    const r = await api('POST', '/api/v1/auth/login', { email: $('email').value.trim(), password: $('password').value });
    sessionStorage.setItem('token', r.token);
    sessionStorage.setItem('roles', JSON.stringify(r.roles.map((x) => x.replace('ROLE_', ''))));
    sessionStorage.setItem('email', $('email').value.trim());
    $('password').value = '';
    start();
  } catch (err) { $('loginErr').textContent = err.message; }
};
function logout() { sessionStorage.clear(); $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); }
$('logout').onclick = logout;

function start() {
  roles = JSON.parse(sessionStorage.getItem('roles') || '[]');
  $('who').textContent = sessionStorage.getItem('email') + ' · ' + roles.join(', ');
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('tabStudents').classList.toggle('hidden', !has('ADMIN', 'TEACHER'));
  $('tabUsers').classList.toggle('hidden', !has('SUPER_ADMIN'));
  document.querySelectorAll('.adminOnly').forEach((el) => el.classList.toggle('hidden', !has('ADMIN')));
  showTab(has('ADMIN', 'TEACHER') ? 'students' : 'users');
}

function showTab(name) {
  ['students', 'users'].forEach((t) => $(t).classList.toggle('hidden', t !== name));
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  name === 'students' ? loadStudents() : loadUsers();
}
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

// --- студенты ---
async function loadStudents() {
  const rows = $('studentRows'); rows.replaceChildren();
  try {
    const r = await api('GET', '/api/v1/student');
    r.response.forEach((s) => {
      const tr = document.createElement('tr'); tr.className = 'click';
      cell(tr, s.id); cell(tr, s.name); cell(tr, s.surname);
      tr.onclick = () => openStudent(s.id);
      rows.appendChild(tr);
    });
  } catch (err) { alertCard(err.message); }
}

async function openStudent(id) {
  const box = $('studentCard'); box.classList.remove('hidden'); box.replaceChildren();
  try {
    const s = await api('GET', '/api/v1/student/' + Number(id));
    const h = document.createElement('h3'); h.textContent = `${s.name} ${s.surname} (ID ${s.id})`; box.appendChild(h);
    const mk = (label, val) => { const p = document.createElement('p'); p.textContent = label + ': ' + (val || '—'); box.appendChild(p); };
    mk('Email', s.email); mk('Телефон', s.phoneNumber);
    if (has('ADMIN')) {
      const email = document.createElement('input'); email.placeholder = 'Новый email'; email.value = s.email || '';
      const phone = document.createElement('input'); phone.placeholder = 'Новый телефон'; phone.value = s.phoneNumber || '';
      const row = document.createElement('div'); row.className = 'row';
      row.append(
        btn('Сохранить контакты', '', async () => {
          try { await api('PUT', '/api/v1/student/' + s.id, { email: email.value.trim(), phoneNumber: phone.value.trim() }); openStudent(s.id); }
          catch (err) { alert(err.message); }
        }),
        btn('Удалить', 'red', async () => {
          if (!confirm(`Удалить ${s.name} ${s.surname}?`)) return;
          try { await api('DELETE', '/api/v1/student/' + s.id); box.classList.add('hidden'); loadStudents(); }
          catch (err) { alert(err.message); }
        }),
        btn('Закрыть', 'gray', () => box.classList.add('hidden')));
      box.append(email, phone, row);
    } else box.appendChild(btn('Закрыть', 'gray', () => box.classList.add('hidden')));
  } catch (err) { box.textContent = err.message; }
}

$('addStudentBtn').onclick = () => $('studentForm').classList.remove('hidden');
$('sCancel').onclick = () => $('studentForm').classList.add('hidden');
$('sSave').onclick = async () => {
  const name = $('sName').value.trim(), surname = $('sSurname').value.trim();
  if (!name || !surname) return ($('sErr').textContent = 'Имя и фамилия обязательны');
  try {
    await api('POST', '/api/v1/student/save', { name, surname, phone_number: $('sPhone').value.trim(), email: $('sEmail').value.trim() });
    ['sName', 'sSurname', 'sPhone', 'sEmail'].forEach((i) => ($(i).value = ''));
    $('sErr').textContent = ''; $('studentForm').classList.add('hidden'); loadStudents();
  } catch (err) { $('sErr').textContent = err.message; }
};

// --- пользователи (SUPER_ADMIN) ---
async function loadUsers() {
  const rows = $('userRows'); rows.replaceChildren();
  try {
    const r = await api('GET', '/api/v1/users');
    r.responses.forEach((u) => {
      const tr = document.createElement('tr');
      cell(tr, u.id); cell(tr, u.email);
      const td = cell(tr, '');
      u.roles.forEach((x) => { const t = document.createElement('span'); t.className = 'tag'; t.textContent = x; td.appendChild(t); });
      const act = cell(tr, '');
      if (u.email !== sessionStorage.getItem('email'))
        act.appendChild(btn('Удалить', 'red', async () => {
          if (!confirm('Удалить ' + u.email + '?')) return;
          try { await api('DELETE', '/api/v1/users/' + u.id); loadUsers(); } catch (err) { alert(err.message); }
        }));
      rows.appendChild(tr);
    });
  } catch (err) { alert(err.message); }
}

$('uSave').onclick = async () => {
  const email = $('uEmail').value.trim(), password = $('uPass').value;
  const r = [...document.querySelectorAll('.uRole:checked')].map((c) => c.value);
  if (!/^\S+@\S+\.\S+$/.test(email)) return ($('uErr').textContent = 'Некорректный email');
  if (password.length < 6) return ($('uErr').textContent = 'Пароль минимум 6 символов');
  if (!r.length) return ($('uErr').textContent = 'Выберите роль');
  try {
    await api('POST', '/api/v1/users/save', { email, password, roles: r });
    $('uEmail').value = $('uPass').value = ''; $('uErr').textContent = ''; loadUsers();
  } catch (err) { $('uErr').textContent = err.message; }
};

function alertCard(msg) { alert(msg); }

if (sessionStorage.getItem('token')) start();
</script>
</body>
</html>
